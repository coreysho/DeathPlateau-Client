on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 8

    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.14'

    - name: Build
      run: gradle build

    - name: Obfuscate
      run: gradle proguard

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: client
        path: |
          build/libs/*

  # THE SUITES THEMSELVES, which until now ran nowhere but on somebody's machine before a
  # merge. That is how run_handovertest sat broken for days: 0dedbb8 gave handOver a boolean
  # and its own test went on reflecting the no-argument method, so it died before reaching a
  # single check, and nothing said so until somebody thought to run it.
  #
  # They were left out on the belief that they were too slow for CI. Measured: 223 seconds for
  # all thirty, and only four of them take longer than six. (The MUTATION suites really are
  # hours - one of them is 83 mutations times a full test run - and still belong nowhere near
  # a push. mutate_guard above is the part of that which is cheap.)
  #
  # IT BUILDS NOTHING. Two suites read build/libs/rs2client-dev.jar, so this takes the jar the
  # build job already made rather than compiling the client a second time with a second JDK -
  # the suites compile the sources they need themselves, with javac.
  #
  # CONTENT IS CHECKED OUT BESIDE IT, at the name the tools look for: ClueSteps, MapLabels and
  # MapIconNames are generated from the content, and their --check runs are the only thing that
  # catches a place or a clue added there and not regenerated here. Without the checkout those
  # three checks skip, and a skip is worth nothing.
  tests:
    name: The client's own test suites
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: DeathPlateau-Client

    - uses: actions/checkout@v4
      with:
        repository: coreysho/DeathPlateau-Content
        ref: 377-wip
        path: DeathPlateau-Content

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 21

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Eleven of the thirty construct a Swing window or an Applet, which needs a display.
    - name: Install xvfb
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - uses: actions/download-artifact@v4
      with:
        name: client
        path: DeathPlateau-Client/build/libs

    - name: Every suite
      working-directory: DeathPlateau-Client
      run: |
        failed=""
        skipped=""
        for f in tools/clienttests/run_*test*.py; do
          name=$(basename "$f" .py)
          echo "::group::$name"
          timeout 900 python3 "$f"
          rc=$?
          echo "::endgroup::"
          # 2 IS "I COULD NOT RUN" AND IS NOT A FAILURE. run_worldmaptest and run_mapicontest
          # draw real squares out of the engine's packed cache, which no runner has; without
          # it there is nothing for them to say. Counted and printed, because a suite that
          # quietly stops running is the whole reason this job exists.
          if [ "$rc" = "2" ]; then
            skipped="$skipped $name"
          elif [ "$rc" != "0" ]; then
            echo "::error title=$name::$name failed"
            failed="$failed $name"
          fi
        done
        [ -n "$skipped" ] && echo "SKIPPED (no engine cache):$skipped"
        if [ -n "$failed" ]; then
          echo "FAILED:$failed"
          exit 1
        fi
        echo "every suite that could run, passed"

  # A MUTATION THAT TESTS NOTHING LOOKS EXACTLY LIKE ONE THAT PASSES. Every mutate_*.py breaks
  # the client one plausible way at a time and checks a named check notices; a pattern whose
  # source has since been renamed or moved matches nothing, and the runners report that as SKIP
  # and count it a survivor. So the suite goes on saying "every mutation was caught" while
  # quietly testing fewer things than it lists.
  #
  # It has happened twice in two days, both times behind somebody else's refactor: the launcher
  # icon check went on grepping the file its call had left, and two login patterns stopped
  # matching when Profile gained a face. Neither showed up in any test run - run_launchertest
  # failed for its own reason, run_loginprofilestest passed throughout.
  #
  # mutate_guard is the backstop and it needs nothing: no build, no cache, no sibling repo, and
  # 974 patterns across 24 files in under a tenth of a second. The full suites still cannot run
  # here - a single one is minutes and the whole set is hours - but the check that they are
  # still pointed at real code can, on every push.
  mutations:
    name: Every mutation pattern still matches its source
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: mutate_guard
      run: python3 tools/clienttests/mutate_guard.py

  deob-map:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Generate deob mapping
      run: |
        cp ref/remap.toml deob.toml
        wget https://github.com/LostCityRS/Deobfuscator/releases/latest/download/Deobfuscator.jar
        java -jar Deobfuscator.jar

    - name: Upload mapping
      uses: actions/upload-artifact@v4
      with:
        name: deob-map
        path: |
          remap.txt
