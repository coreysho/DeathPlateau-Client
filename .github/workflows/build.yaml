on:
  push:

# THE RUNNER IS NAMED, NOT 'latest'. ubuntu-latest is rolling from 24.04 to 26.04 between 19
# October and 19 November 2026, so a job can pass in the morning and fail in the afternoon on an
# image nobody chose - and that failure reads as a code failure. 26.04 was chosen deliberately and
# watched going in; ubuntu-24.04 is the fallback if something in the image turns out to matter.
#
# The action versions are each one's latest release, read from the API: a v4 that GitHub is already
# force-running on Node 24 is a version that will stop working, not one that is merely old.
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 8

    # NO gradle-version. The wrapper in the repository is the one source of truth for which
    # Gradle builds this client; a pin here is a second one, and the two had already drifted -
    # the wrapper said 8.11.1 while this said 8.14, so a local build and a CI build were
    # different tools and nothing recorded which made a release. setup-gradle still does the
    # caching; ./gradlew decides the version.
    - uses: gradle/actions/setup-gradle@v6

    - name: Build
      run: ./gradlew build

    - name: Obfuscate
      run: ./gradlew proguard

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: client
        path: |
          build/libs/*

  # THE SUITES THEMSELVES, which until now ran nowhere but on somebody's machine before a
  # merge. That is how run_handovertest sat broken for days: 0dedbb8 gave handOver a boolean
  # and its own test went on reflecting the no-argument method, so it died before reaching a
  # single check, and nothing said so until somebody thought to run it.
  #
  # They were left out on the belief that they were too slow for CI. Measured: 223 seconds for
  # all thirty, and only four of them take longer than six. (The MUTATION suites really are
  # hours - one of them is 83 mutations times a full test run - and still belong nowhere near
  # a push. mutate_guard above is the part of that which is cheap.)
  #
  # IT BUILDS NOTHING. Two suites read build/libs/rs2client-dev.jar, so this takes the jar the
  # build job already made rather than compiling the client a second time with a second JDK -
  # the suites compile the sources they need themselves, with javac.
  #
  # CONTENT IS CHECKED OUT BESIDE IT, at the name the tools look for: ClueSteps, MapLabels and
  # MapIconNames are generated from the content, and their --check runs are the only thing that
  # catches a place or a clue added there and not regenerated here. Without the checkout those
  # three checks skip, and a skip is worth nothing.
  tests:
    name: The client's own test suites
    needs: build
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
      with:
        path: DeathPlateau-Client

    - uses: actions/checkout@v7
      with:
        repository: coreysho/DeathPlateau-Content
        ref: 377-wip
        path: DeathPlateau-Content

    # THE ENGINE, AND A CACHE PACKED OUT OF IT. Three suites read real squares, real map icons
    # and a real login out of data/pack, and with no engine here all three printed SKIP on every
    # push - counted, but never run anywhere else either, which is how run_mapicontest came to
    # have a bug that disabled it everywhere and went weeks without being noticed.
    #
    # Engine-TS is the name the suites look for beside the client checkout. Measured on a cold
    # clone: npm ci, npm run rsa and npm run build come to about a minute and forty seconds.
    - uses: actions/checkout@v7
      with:
        repository: coreysho/DeathPlateau-Engine
        ref: 377-wip
        path: Engine-TS

    # The engine compiles content from ../content whatever BUILD_SRC_DIR says, so it has to be
    # there under that name. A link rather than a second checkout: the content clone is 350MB.
    - name: Content beside the engine
      run: ln -s DeathPlateau-Content content

    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 21

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: Engine-TS/package-lock.json

    # The key is per-machine and never committed, so this one is made here and thrown away with
    # the runner; the suite reads the modulus out of it and tells the client. The migrations are
    # not optional either: a clone has no db.sqlite, and a world with no account table refuses
    # every login - which is how the first run of this job failed, in all five phases at once.
    - name: Pack the client cache
      working-directory: Engine-TS
      run: |
        npm ci
        npm run rsa
        npm run sqlite:migrate
        npm run build

    # Eleven of the thirty construct a Swing window or an Applet, which needs a display.
    - name: Install xvfb
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - uses: actions/download-artifact@v8
      with:
        name: client
        path: DeathPlateau-Client/build/libs

    - name: Every suite
      working-directory: DeathPlateau-Client
      run: |
        failed=""
        skipped=""
        for f in tools/clienttests/run_*test*.py; do
          name=$(basename "$f" .py)
          echo "::group::$name"
          # `|| rc=$?` AND NOT A BARE CALL: a run: step is bash -e, so a suite returning
          # non-zero ends the whole step there and then - the first skip killed the job one
          # suite short of the end, with the reason printed and nothing to read it.
          rc=0
          # Kept as well as printed, so the failure can be said out loud below. The group still
          # has all of it.
          timeout 900 python3 "$f" >"/tmp/$name.out" 2>&1 || rc=$?
          cat "/tmp/$name.out"
          echo "::endgroup::"
          # 2 IS "I COULD NOT RUN" AND IS NOT A FAILURE - a suite with nothing to say rather
          # than something to report. This job now packs a cache, so the three that need one
          # no longer skip here; what is left is a missing display or a missing tool. Counted
          # and printed either way, because a suite that quietly stops running is the whole
          # reason this job exists - run_mapicontest skipped everywhere for weeks with a bug
          # in it, and the skip looked like a decision somebody had made.
          if [ "$rc" = "2" ]; then
            skipped="$skipped $name"
          elif [ "$rc" != "0" ]; then
            # WITH THE REASON IN IT. An annotation saying only "failed" sends whoever reads the
            # summary into the log to find out what, and the suites have already said it: these
            # print named checks, and the last lines are the answer nearly every time. %0A is a
            # newline to the annotation parser, and a literal % has to go first or it eats one.
            # THE LINES THAT FAILED, not the ones that happened last: a suite with several
            # phases ends on whichever ran last, which is as likely as not one that passed. The
            # first run of this printed a green phase directly under the word "failed", with
            # "2 PHASE(S) FAILED" the only hint that anything had. Headings and FAILs when there
            # are any, the tail when there are none.
            why=$( { grep -E '^====|^phase:|FAIL' "/tmp/$name.out" || tail -n 14 "/tmp/$name.out"; } \
                   | tail -n 24 | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$name::$name failed%0A$why"
            failed="$failed $name"
          fi
        done
        [ -n "$skipped" ] && echo "SKIPPED:$skipped"
        # AND A SKIP FROM THESE THREE IS A FAILURE. They are the ones that need a packed cache,
        # and this job packs one - so there is nothing left for them to skip for, and a skip means
        # the pack, the login key or the migrations did not arrive. Everything about today came out
        # of a skip that read as a decision somebody had made: run_mapicontest printed one on every
        # push for weeks with a bug in it that disabled it everywhere.
        for want in run_worldmaptest run_mapicontest run_logintokentest; do
          case " $skipped " in
            *" $want "*)
              echo "::error title=$want::$want skipped, and it cannot: this job packs a cache, so the pack, the login key or the migrations did not arrive"
              failed="$failed $want"
              ;;
          esac
        done
        if [ -n "$failed" ]; then
          echo "FAILED:$failed"
          exit 1
        fi
        echo "every suite that could run, passed"

  # A MUTATION THAT TESTS NOTHING LOOKS EXACTLY LIKE ONE THAT PASSES. Every mutate_*.py breaks
  # the client one plausible way at a time and checks a named check notices; a pattern whose
  # source has since been renamed or moved matches nothing, and the runners report that as SKIP
  # and count it a survivor. So the suite goes on saying "every mutation was caught" while
  # quietly testing fewer things than it lists.
  #
  # It has happened twice in two days, both times behind somebody else's refactor: the launcher
  # icon check went on grepping the file its call had left, and two login patterns stopped
  # matching when Profile gained a face. Neither showed up in any test run - run_launchertest
  # failed for its own reason, run_loginprofilestest passed throughout.
  #
  # mutate_guard is the backstop and it needs nothing: no build, no cache, no sibling repo, and
  # 974 patterns across 24 files in under a tenth of a second. The full suites still cannot run
  # here - a single one is minutes and the whole set is hours - but the check that they are
  # still pointed at real code can, on every push.
  mutations:
    name: Every mutation pattern still matches its source
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    # AND THAT THE NIGHTLY STILL RUNS ALL OF THEM. The matrix in mutations-nightly.yaml is a
    # list somebody has to remember to add to, and a suite that is not in it runs nowhere - the
    # exact state that workflow exists to end. Compared here, on every push, so the gap fails on
    # the commit that opens it.
    - name: Every suite is in the nightly matrix
      run: |
        listed=$(sed -n '/^          - /p' .github/workflows/mutations-nightly.yaml | sed 's/^          - //' | sort)
        on_disk=$(ls tools/clienttests/mutate_*.py | sed 's#.*/mutate_##; s#\.py$##' | grep -v '^guard$' | sort)
        if [ "$listed" != "$on_disk" ]; then
          echo "the nightly matrix and the suites on disk have drifted:"
          diff <(echo "$listed") <(echo "$on_disk") || true
          echo "::error title=mutations nightly::a mutation suite is missing from the nightly matrix, so it runs nowhere"
          exit 1
        fi
        echo "all $(echo "$on_disk" | wc -l) suites are in the nightly matrix"

    - name: mutate_guard
      run: python3 tools/clienttests/mutate_guard.py

  deob-map:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Generate deob mapping
      run: |
        cp ref/remap.toml deob.toml
        wget https://github.com/LostCityRS/Deobfuscator/releases/latest/download/Deobfuscator.jar
        java -jar Deobfuscator.jar

    - name: Upload mapping
      uses: actions/upload-artifact@v7
      with:
        name: deob-map
        path: |
          remap.txt
