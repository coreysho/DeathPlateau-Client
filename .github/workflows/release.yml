# EVERY PUSH TO dev-logging IS A CLIENT RELEASE. The client is built here and published as the
# latest GitHub Release, as client.jar; players' launchers (launcher/, attached to every release as
# Death-Plateau-Launcher.jar) fetch it the next time they start the game. So shipping a client change is: push.
#
# Tags are client-<run number>, which only ever go up. The launcher compares tags for equality, not
# order, so it always takes whatever GitHub calls latest - including after a revert.
name: release

on:
  push:
    branches: [dev-logging]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 8

    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.14'

    # The same jar gradlew.bat build makes locally - not the proguard one.
    - name: Build client
      run: |
        gradle build
        cp build/libs/rs2client-dev.jar client.jar

    - name: Build launcher
      run: |
        mkdir -p launcher/out
        javac -source 8 -target 8 -encoding UTF-8 -d launcher/out $(find launcher/src -name '*.java')
        cp -r src/main/resources/deathplateau launcher/out/
        jar cfe Death-Plateau-Launcher.jar lostcity.Launcher -C launcher/out .

    # WHY AN EXE EXISTS AT ALL. The icon on a .jar in Explorer is the file-type icon Windows
    # draws for .jar, owned by whichever Java runtime is registered - nothing inside the archive
    # can change it, and setIconImages only reaches the window. So Windows players get the same
    # launcher wrapped in an .exe carrying our own icon. The .jar is still published and is still
    # the real artefact: macOS, Linux and anyone running java -jar use it.
    #
    # launch4j is pinned by checksum, not by tag. This step runs on every release and pulls a
    # binary off the internet into the thing players then download; a version number alone would
    # let that binary change under us without anything saying so.
    - name: Wrap the launcher for Windows
      run: |
        curl -sSL --retry 3 -o launch4j.tgz \
          "https://sourceforge.net/projects/launch4j/files/launch4j-3/3.50/launch4j-3.50-linux-x64.tgz/download"
        echo "a6ad95c2fb6300410543288308b4eeae72ecd1df033928dfc524ba539bbc4d36  launch4j.tgz" | sha256sum -c -
        tar xzf launch4j.tgz
        # The bundled launch4j shell script has CRLF line endings and will not execute on Linux;
        # the jar is the same program. Its classes are Java 8, so this JDK runs it.
        java -jar launch4j/launch4j.jar launcher/launch4j.xml
        test -f Death-Plateau-Launcher.exe

    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="client-${{ github.run_number }}"
        # GitHub turns spaces in an asset's file name into dots, so the name players see on the
        # release page is the label after the #
        gh release create "$TAG" client.jar \
          "Death-Plateau-Launcher.exe#Death Plateau Launcher (Windows)" \
          "Death-Plateau-Launcher.jar#Death Plateau Launcher (jar)" \
          --target "${{ github.sha }}" \
          --title "Client $TAG" \
          --notes "$(git log -1 --format=%s)" \
          --latest
