# EVERY PUSH TO dev-logging IS A CLIENT RELEASE. The client is built here and published as the
# latest GitHub Release, as client.jar; players' launchers (launcher/, attached to every release as
# Death-Plateau-Launcher.jar) fetch it the next time they start the game. So shipping a client change is: push.
#
# Tags are client-<run number>, which only ever go up. The launcher compares tags for equality, not
# order, so it always takes whatever GitHub calls latest - including after a revert.
name: release

on:
  push:
    branches: [dev-logging]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 8

    # NO gradle-version: the wrapper in the repository decides, and it is the only thing that
    # does. See the comment in build.yaml - these two had drifted apart from it already.
    - uses: gradle/actions/setup-gradle@v6

    # THE ENGINE, FOR THE QUEST HELPER'S STEP TABLE. data/quests.json there is generated by its
    # exporter; the copy committed in this repository used to be carried across by hand, and on
    # 10 November it was a day stale - the helper was leaving eleven steps out, three of them on
    # The Feud. build.gradle takes the engine's table when it is pointed at one, so what ships is
    # generated rather than remembered. See the long comment on `questTable` in build.gradle.
    #
    # NOT FATAL IF IT DOES NOT ARRIVE, and the fallback is a real answer rather than a shrug: the
    # committed table is checked against this very file by run_helpertabletest.py on every push to
    # this repository, so a release built without the engine ships a table that was verified at
    # this commit. A release that cannot go out at all is worse than that, and the warning says
    # which happened.
    - name: The engine, for the quest helper's step table
      continue-on-error: true
      uses: actions/checkout@v7
      with:
        repository: coreysho/DeathPlateau-Engine
        ref: 377-wip
        path: engine

    # The same jar gradlew.bat build makes locally - not the proguard one. And now literally the
    # same: the same wrapper, so the same Gradle, rather than two pins that happened to agree.
    - name: Build client
      run: |
        table=engine/data/quests.json
        if [ -f "$table" ]; then
          ./gradlew build -PquestTable="$table"
        else
          echo "::warning title=quest table::the engine checkout did not arrive, so the committed table ships - run_helpertabletest checks it on every push, but it was not generated here"
          ./gradlew build
        fi
        cp build/libs/rs2client-dev.jar client.jar

    - name: Build launcher
      run: |
        mkdir -p launcher/out
        javac -source 8 -target 8 -encoding UTF-8 -d launcher/out $(find launcher/src -name '*.java')
        cp -r src/main/resources/deathplateau launcher/out/
        # THE SAME TABLE THE CLIENT JAR GOT. This jar carries that resource directory too, and
        # the step above may have taken the quest table from the engine - so overlay it here as
        # well, or the launcher would carry the committed one and the two jars would disagree.
        #
        # GUARDED, AND FROM THE ENGINE RATHER THAN FROM build/resources: this block is not only
        # run here. tools/clienttests/run_launchertest.py reads it out of this file and runs it
        # against a plain copy of the repository - no gradle, so no build/resources - which is
        # the only way a test of a build step stays true to the step. Reaching into gradle's
        # output coupled the launcher to a build that had not happened, and that suite said so.
        if [ -f engine/data/quests.json ]; then
          cp engine/data/quests.json launcher/out/deathplateau/quests.json
        fi
        jar cfe Death-Plateau-Launcher.jar lostcity.Launcher -C launcher/out .

    # NO WINDOWS .EXE, DELIBERATELY. The icon on a .jar in Explorer is the file-type icon Windows
    # draws for .jar and nothing inside the archive can change it, so the only way to put our own
    # icon on the downloaded file is to wrap the jar in an .exe. That was built and it worked -
    # launch4j, the badge embedded, one self-contained file - and it is not shipped, because an
    # unsigned wrapped exe draws a SmartScreen "Windows protected your PC" box on first run and
    # the occasional antivirus false positive. To a player downloading a game client from a
    # stranger, that reads as "this is a virus", which is a worse first impression than a generic
    # Java icon. It needs a code-signing certificate to be worth doing; until there is one, the
    # jar is what ships. See the commit that added it for the launch4j config and its test.
    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="client-${{ github.run_number }}"
        # GitHub turns spaces in an asset's file name into dots, so the name players see on the
        # release page is the label after the #
        gh release create "$TAG" client.jar "Death-Plateau-Launcher.jar#Death Plateau Launcher" \
          --target "${{ github.sha }}" \
          --title "Client $TAG" \
          --notes "$(git log -1 --format=%s)" \
          --latest
