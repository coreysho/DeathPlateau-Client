# EVERY PUSH TO dev-logging IS A CLIENT RELEASE. The client is built here and published as the
# latest GitHub Release, as client.jar; players' launchers (launcher/, attached to every release as
# Death-Plateau-Launcher.jar) fetch it the next time they start the game. So shipping a client change is: push.
#
# Tags are client-<run number>, which only ever go up. The launcher compares tags for equality, not
# order, so it always takes whatever GitHub calls latest - including after a revert.
name: release

on:
  push:
    branches: [dev-logging]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 8

    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.14'

    # The same jar gradlew.bat build makes locally - not the proguard one.
    - name: Build client
      run: |
        gradle build
        cp build/libs/rs2client-dev.jar client.jar

    - name: Build launcher
      run: |
        mkdir -p launcher/out
        javac -source 8 -target 8 -encoding UTF-8 -d launcher/out $(find launcher/src -name '*.java')
        cp -r src/main/resources/deathplateau launcher/out/
        jar cfe Death-Plateau-Launcher.jar lostcity.Launcher -C launcher/out .

    # NO WINDOWS .EXE, DELIBERATELY. The icon on a .jar in Explorer is the file-type icon Windows
    # draws for .jar and nothing inside the archive can change it, so the only way to put our own
    # icon on the downloaded file is to wrap the jar in an .exe. That was built and it worked -
    # launch4j, the badge embedded, one self-contained file - and it is not shipped, because an
    # unsigned wrapped exe draws a SmartScreen "Windows protected your PC" box on first run and
    # the occasional antivirus false positive. To a player downloading a game client from a
    # stranger, that reads as "this is a virus", which is a worse first impression than a generic
    # Java icon. It needs a code-signing certificate to be worth doing; until there is one, the
    # jar is what ships. See the commit that added it for the launch4j config and its test.
    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="client-${{ github.run_number }}"
        # GitHub turns spaces in an asset's file name into dots, so the name players see on the
        # release page is the label after the #
        gh release create "$TAG" client.jar "Death-Plateau-Launcher.jar#Death Plateau Launcher" \
          --target "${{ github.sha }}" \
          --title "Client $TAG" \
          --notes "$(git log -1 --format=%s)" \
          --latest
